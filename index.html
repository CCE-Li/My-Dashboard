<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="硬核工业风个人起始页：Codeforces 进度、Command Code 用量、BRZ 购车基金。" />
    <title>SYS://RAW_INDUSTRIAL_STARTPAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 尽早套用已保存的主题，避免首屏先闪一下默认配色。
      // 键名必须与 src/services/storage.ts 里的 STORAGE_KEYS.theme 一致；
      // 值非法也没关系 —— tokens.css 的 :root 会兜住默认主题。
      try {
        var savedTheme = localStorage.getItem('mydash:v1:theme');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch (error) {
        /* 隐私模式下读不到 localStorage，忽略即可 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>本起始页需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
